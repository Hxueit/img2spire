[package]
name = "img2spire"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.15"
eframe = "0.33.3"
enigo = "0.6.1"
env_logger = "0.11.10"
global-hotkey = "0.7.0"
image = "0.25.10"
imageproc = "0.26.1"
log = "0.4.29"
rfd = "0.17.2"
xcap = "0.9.3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"     
lto = true          
codegen-units = 1   
panic = "abort"     
strip = true        
